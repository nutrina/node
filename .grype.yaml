# Advisories the CI gate ignores until a fix can be applied in this image.
#
# Each rule names one advisory and the package and location it applies to.
# CI runs scripts/check-ignored-fixes.js after every scan. That step fails, and
# the image is not pushed, when an ignored advisory has a fix this repo can
# apply: a fixed version on the same major (pin it in patches.json), or a newer
# npm release that bundles a fixed copy (move the npm pin). Remove the rule at
# the same time as applying the fix.

ignore:
  # Added 2026-11-05. Fixed only in glob 14.0.2. npm 11.21.2 and 12.2.2 still
  # bundle glob 13, and patch-image.js will not swap npm's copy to a new major.
  - vulnerability: GHSA-3g3m-2fjr-6pw4
    reason: npm bundles glob 13 and the fix is only in glob 14. Used by the npm CLI, not by Node at runtime.
    package:
      name: glob
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"

  # Added 2026-11-05. Fixed only in minimatch 11.0.1. npm 11.21.2 and 12.2.2
  # still bundle minimatch 10.
  - vulnerability: GHSA-g3hv-75wg-m249
    reason: npm bundles minimatch 10 and the fix is only in minimatch 11. Used by the npm CLI, not by Node at runtime.
    package:
      name: minimatch
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"
