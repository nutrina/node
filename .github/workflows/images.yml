name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC. Picks up new Node releases and distro security updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Read image archives that pull request runs uploaded.
  actions: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.gen.outputs.flavors }}
      image: ${{ steps.gen.outputs.image }}
      platforms: ${{ steps.gen.outputs.platforms }}
      grype: ${{ steps.gen.outputs.grype }}
      fail_on: ${{ steps.gen.outputs.fail_on }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        run: |
          set -euo pipefail
          jq -e '.image and .platforms and .grype and .failOn and (.flavors | length > 0)' flavors.json >/dev/null
          {
            echo "image=$(jq -r '.image' flavors.json)"
            echo "platforms=$(jq -r '.platforms | join(",")' flavors.json)"
            echo "grype=$(jq -r '.grype' flavors.json)"
            echo "fail_on=$(jq -r '.failOn' flavors.json)"
            echo "flavors<<EOF"
            jq -c '.flavors' flavors.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.prepare.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The image depends only on these inputs, plus the base image and distro
      # packages at build time. A push to main reuses the archive a pull request
      # built and tested from the same inputs, rather than building it again.
      # Aliases are left out: they name the image and do not change it.
      - name: Fingerprint the build inputs
        id: inputs
        env:
          IMAGE: ${{ matrix.flavor.image || needs.prepare.outputs.image }}
          TAG: ${{ matrix.flavor.tag }}
          DOCKERFILE: ${{ matrix.flavor.dockerfile || 'Dockerfile' }}
        run: |
          set -euo pipefail
          hash=$(
            {
              sha256sum "$DOCKERFILE" .dockerignore patches.json scripts/patch-image.js
              echo "image=${IMAGE}"
              echo "tag=${TAG}"
              echo "nodeTag=${{ matrix.flavor.nodeTag }}"
              echo "base=${{ matrix.flavor.base }}"
              echo "platforms=${{ needs.prepare.outputs.platforms }}"
            } | sha256sum | cut -c1-16
          )
          echo "artifact=oci-${IMAGE//\//-}-${TAG}-${hash}" | tee -a "$GITHUB_OUTPUT"

      - name: Find the image a pull request built
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.inputs.outputs.artifact }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          # Only accept runs on branches of this repository. A pull request from a
          # fork runs the fork's workflow and could upload any archive under this name.
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" --jq "
            [.artifacts[]
              | select(.expired | not)
              | select(.workflow_run.repository_id == ${REPO_ID})
              | select(.workflow_run.head_repository_id == ${REPO_ID})]
            | sort_by(.created_at) | last | .workflow_run.id // empty")

          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D . && [ -f oci-image.tar ]; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "Reusing ${ARTIFACT} from ${url}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.flavor.tag }}: reused the image built and tested in [run ${run_id}](${url}). Not rebuilt." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f oci-image.tar
            echo "No usable pull request archive named ${ARTIFACT}. Building."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # A flavor names its own image, Dockerfile and base when it is not Node (apk.Dockerfile:
      # nginx, golang); a Node flavor uses the defaults. The cache scope carries the image, since
      # two images may one day share a tag.
      - name: Build ${{ matrix.flavor.image || needs.prepare.outputs.image }}:${{ matrix.flavor.tag }}
        if: steps.reuse.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.flavor.dockerfile || 'Dockerfile' }}
          pull: true
          platforms: ${{ needs.prepare.outputs.platforms }}
          outputs: type=oci,dest=oci-image.tar
          build-args: |
            NODE_TAG=${{ matrix.flavor.nodeTag }}
            BASE_IMAGE=${{ matrix.flavor.base }}
            IMAGE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.flavor.image || needs.prepare.outputs.image }}-${{ matrix.flavor.tag }}
          cache-to: type=gha,scope=${{ matrix.flavor.image || needs.prepare.outputs.image }}-${{ matrix.flavor.tag }},mode=max,ignore-error=true

      - name: Install Grype and Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin "${{ needs.prepare.outputs.grype }}"
          grype version
          skopeo --version

      - name: Security scan built image
        run: |
          set -euo pipefail
          fail_on="${{ needs.prepare.outputs.fail_on }}"
          case "$fail_on" in
            critical) sevs='["Critical"]' ;;
            high) sevs='["High","Critical"]' ;;
            medium) sevs='["Medium","High","Critical"]' ;;
            *) echo "unknown failOn: $fail_on" >&2; exit 1 ;;
          esac

          # Scan the archive that publish will copy. A failure here skips the push.
          failed=0
          IFS=',' read -ra platforms <<< "${{ needs.prepare.outputs.platforms }}"
          for platform in "${platforms[@]}"; do
            safe="${platform//\//-}"
            echo "Scanning ${platform}"
            grype "oci-archive:oci-image.tar" -c .grype.yaml --platform "$platform" --only-fixed -o json > "grype-fixed-${safe}.json"
            grype "oci-archive:oci-image.tar" -c .grype.yaml --platform "$platform" -o json > "grype-full-${safe}.json"
            grype "oci-archive:oci-image.tar" -c .grype.yaml --platform "$platform" --only-fixed -o sarif > "grype-${safe}.sarif"

            echo "Fixable findings at or above ${fail_on} for ${platform}:"
            jq -r --argjson sevs "$sevs" '
              .matches[]
              | select(.vulnerability.severity as $s | $sevs | index($s))
              | "\(.vulnerability.severity)\t\(.artifact.name)@\(.artifact.version)\t\(.vulnerability.id)\t\(.artifact.type)"
            ' "grype-fixed-${safe}.json" | sort -u

            count=$(jq -r --argjson sevs "$sevs" '
              [.matches[] | select(.vulnerability.severity as $s | $sevs | index($s))] | length
            ' "grype-fixed-${safe}.json")
            echo "${platform} count=${count}"
            if [ "$count" -gt 0 ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Grype reported fixable vulnerabilities. The image was not pushed." >&2
            exit 1
          fi
          touch scan-passed

      # Advisories ignored in .grype.yaml must not stay ignored once a fix can
      # be applied. A failure here skips the push.
      - name: Check ignored advisories for fixes
        run: |
          set -euo pipefail
          rules="${RUNNER_TEMP}/grype-ignore-rules.json"
          yq -o=json '.ignore // []' .grype.yaml > "$rules"
          node scripts/check-ignored-fixes.js "$rules" patches.json grype-full-*.json

      - name: Load the amd64 image
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:${PWD}/oci-image.tar" \
            "docker-daemon:local/image:${{ matrix.flavor.tag }}"

      # What the image is for, run for real: Node runs npm install, nginx serves a page, Go builds
      # a binary. A version check alone would pass on an image whose upgrade broke the program.
      - name: Smoke test
        run: |
          set -euo pipefail
          image="local/image:${{ matrix.flavor.tag }}"
          case "${{ matrix.flavor.smoke || 'node' }}" in
            node)
              expected="${{ matrix.flavor.nodeTag }}"
              expected="v${expected%%-*}"
              docker run --rm "$image" node -e "if (process.version !== '${expected}') { console.error(process.version); process.exit(1) } console.log(process.version)"
              docker run --rm "$image" npm --version
              docker run --rm --user node "$image" sh -c 'mkdir -p "$HOME/app" && cd "$HOME/app" && npm init -y >/dev/null && npm install --silent left-pad@1.0.0 && node -e "if (require(\"left-pad\")(\"x\", 3) !== \"  x\") process.exit(1)"'
              ;;
            nginx)
              expected="nginx/${{ matrix.flavor.tag }}"
              expected="${expected%%-*}"
              docker run --rm "$image" nginx -v 2>&1 | tee /dev/stderr | grep -qx "nginx version: ${expected}"
              container=$(docker run -d --rm -p 127.0.0.1:8080:80 "$image")
              trap 'docker stop "$container" >/dev/null' EXIT
              for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
              curl -fsS http://127.0.0.1:8080/ | grep -q "Welcome to nginx"
              ;;
            go)
              expected="go${{ matrix.flavor.tag }}"
              expected="${expected%%-*}"
              docker run --rm "$image" go version | tee /dev/stderr | grep -q "^go version ${expected} "
              docker run --rm "$image" sh -c 'mkdir /tmp/smoke && cd /tmp/smoke && go mod init smoke >/dev/null 2>&1 && printf "package main\n\nfunc main() { println(\"ok\") }\n" > main.go && CGO_ENABLED=0 go build -o smoke . && ./smoke'
              ;;
            *) echo "unknown smoke test: ${{ matrix.flavor.smoke }}" >&2; exit 1 ;;
          esac

      # Runs only after the scan, the ignored-advisory check, and the smoke test
      # pass. Forks are excluded: main never reuses their archives.
      - name: Keep the image for the merge
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.inputs.outputs.artifact }}
          path: oci-image.tar
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload Grype reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-${{ matrix.flavor.tag }}
          path: grype-*
          retention-days: 30

      - name: Upload amd64 Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-linux-amd64.sarif
          category: grype-${{ matrix.flavor.tag }}-linux-amd64

      - name: Upload arm64 Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-linux-arm64.sarif
          category: grype-${{ matrix.flavor.tag }}-linux-arm64

      # Runs on every event so pull requests show the tags a merge would publish.
      - name: Name the published tags
        run: |
          set -euo pipefail
          test -f scan-passed
          image="${{ matrix.flavor.image || needs.prepare.outputs.image }}"
          tag="${{ matrix.flavor.tag }}"
          date=$(date -u +%Y%m%d)
          if [ "${{ matrix.flavor.smoke || 'node' }}" = node ]; then
            node_version=$(docker run --rm "local/image:${tag}" node -p 'process.version.slice(1)')
            # A tag like 24.22.2-alpine already includes the full Node version.
            # A tag like 24-alpine does not, so append the version from the image.
            if [[ "$tag" == "$node_version-"* || "$tag" == "$node_version" ]]; then
              version_tag="$tag"
            else
              version_tag="${node_version}-${tag#*-}"
            fi
          else
            # The other images' tags name the full version of the official tag they patch.
            version_tag="$tag"
          fi
          {
            echo "${image}:${tag}"
            echo "${image}:${version_tag}"
            echo "${image}:${version_tag}-${date}"
            jq -r --arg t "$tag" --arg image "$image" \
              '.flavors[] | select(.tag == $t) | .aliases[]? | "\($image):\(.)"' flavors.json
          } | awk 'NF && !seen[$0]++' | tee image-tags.txt

          if [[ "${{ github.ref }}" != 'refs/heads/main' || "${{ github.event_name }}" == 'pull_request' ]]; then
            {
              echo "### ${image}:${tag}: not pushed (${{ github.event_name }} on ${{ github.ref_name }})"
              echo
              echo "A run on \`main\` would publish:"
              echo
              sed 's/.*/- `&`/' image-tags.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          # A variable, not a secret: GitHub masks every secret value in logs and
          # summaries, which hid the "nutrina" in every image name as "***".
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f scan-passed
          test -f oci-image.tar
          test -s image-tags.txt
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Set the DOCKERHUB_USERNAME repository variable (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | skopeo login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          mapfile -t tags < image-tags.txt
          primary="docker.io/${tags[0]}"
          skopeo copy --all "oci-archive:${PWD}/oci-image.tar" "docker://${primary}"
          for tag in "${tags[@]:1}"; do
            [ -n "$tag" ] || continue
            skopeo copy --all "docker://${primary}" "docker://docker.io/${tag}"
          done

          # Digest of the multi-platform index as stored in the registry.
          digest="sha256:$(skopeo inspect --raw "docker://${primary}" | sha256sum | cut -d' ' -f1)"
          echo "Published ${tags[*]} at ${digest}"
          {
            echo "### ${tags[0]}: published"
            echo
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            for tag in "${tags[@]}"; do
              [ -n "$tag" ] || continue
              echo "| \`docker.io/${tag}\` | \`${digest}\` |"
            done
            echo
            echo '```sh'
            echo "docker pull docker.io/${tags[0]%%:*}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
